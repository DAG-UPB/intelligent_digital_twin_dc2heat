[project]
name = "intelligent-digital-twin"
version = "1.3.0"
description = "Local digital twin of a data center: causal graphs, learned models, what-if scenarios and heat reuse."
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",  # P&ID uploads run off the event loop
    "fastapi>=0.135.2",
    "gplearn>=0.4.2",  # symbolic regression (pure Python, small)
    "joblib>=1.4.0",  # needed by tigramite
    "numpy>=2.0",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "pydantic>=2.7",
    "scipy>=1.11",  # physics equations: least-squares fit of coefficients
    "sympy>=1.12",  # simplifies symbolic-regression formulas into readable equations
    "tabpfn>=7.0.1",
    "tigramite>=5.2.8",
    "uvicorn>=0.34.0",
    "xgboost>=3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
foundation = [
    "chronos-forecasting>=2.3.2",
]

[tool.uv]
# foundation: Chronos-2 (pretrained forecaster, torch comes with tabpfn), imported only when its model runs
default-groups = ["dev", "foundation"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]  # a ternary is not always clearer than if/else

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
markers = ["slow: needs TabPFN, gplearn or tigramite (minutes, more memory); run with -m slow"]
addopts = "-m 'not slow'"
